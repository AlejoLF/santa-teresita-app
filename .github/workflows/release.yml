name: Release Desktop

# Dispara de DOS formas:
#
#  1) Push de un tag `v*` (ej. `git push origin v2.0.0-alpha.57`) — el flujo
#     histórico desde la PC del dev. Buildea el .exe y lo publica al Release.
#
#  2) "Run workflow" (workflow_dispatch) desde la web/app de GitHub — pensado
#     para lanzar DESDE EL CELULAR. El job `prepare` bumpea la versión de
#     apps/desktop, commitea a main, crea el tag y en el mismo run dispara el
#     build. No hay que tocar archivos ni tipear tags a mano → elimina el
#     drift versión/tag que hizo fallar alpha.54.
#
# El build (job `build-desktop`) es idéntico para ambos caminos; solo cambia
# de dónde sale la versión/tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Qué publicar'
        type: choice
        default: prerelease
        options:
          - prerelease   # 2.0.0-alpha.56 → 2.0.0-alpha.57 (el caso normal)
          - custom       # una versión exacta (campo de abajo)
      custom_version:
        description: 'Versión exacta SIN la v (solo si bump=custom). Ej: 2.0.0-alpha.60'
        required: false
        default: ''

permissions:
  contents: write # subir assets al release + pushear el bump/tag a main

jobs:
  # ── Solo en "Run workflow" (celu): bump + commit + tag ────────────────────
  # Corre en ubuntu (rápido/barato — son solo git ops, sin build).
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # historial completo para poder commitear+pushear

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump versión en apps/desktop/package.json
        id: bump
        working-directory: apps/desktop
        run: |
          if [ "${{ inputs.bump }}" = "custom" ]; then
            if [ -z "${{ inputs.custom_version }}" ]; then
              echo "::error::bump=custom pero custom_version está vacío"; exit 1
            fi
            npm version "${{ inputs.custom_version }}" --no-git-tag-version --allow-same-version
          else
            # prerelease mantiene el preid (-alpha.N → -alpha.N+1)
            npm version prerelease --preid alpha --no-git-tag-version
          fi
          VER="$(node -p "require('./package.json').version")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Nueva versión: $VER (tag v$VER)"

      - name: Commit bump + crear/pushear tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json
          git commit -m "chore(desktop): release $TAG (workflow_dispatch)"
          git push origin HEAD:main
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  # ── Build del .exe: corre en tag push (PC) o después de `prepare` (celu) ───
  build-desktop:
    needs: [prepare]
    # always() para que corra aunque `prepare` esté skipped (caso tag push).
    if: ${{ always() && (github.event_name == 'push' || needs.prepare.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # dispatch → el tag recién creado por `prepare`; tag push → github.ref
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.tag || github.ref }}

      - name: Resolver tag/versión
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = "${{ needs.prepare.outputs.tag }}"
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Building tag=$tag (version $($tag.TrimStart('v')))"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        # No `version:` aquí — el action lo lee automáticamente de
        # `packageManager` en package.json (pnpm@9.12.0). Si especificáramos
        # ambos, el action falla con "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sta/db run generate

      - name: Download VC++ Redistributable (bundled in NSIS installer)
        working-directory: apps/desktop
        run: pnpm run ensure:vcredist

      # `cloud-config.json` está gitignored (la URL incluye password). Lo
      # generamos en CI desde el secret SUPABASE_DB_URL para que el installer
      # ya venga preconfigurado y la encargada no tenga que crear archivos a
      # mano. Si el secret no está, el .exe se buildea igual pero al primer
      # arranque va a pedir config manual en %APPDATA%/Santa Teresita/config.json.
      - name: Write cloud-config.json from SUPABASE_DB_URL secret
        working-directory: apps/desktop
        shell: pwsh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if ([string]::IsNullOrEmpty($env:SUPABASE_DB_URL)) {
            Write-Output "::warning::SUPABASE_DB_URL secret no seteada — installer va a requerir config manual al primer arranque"
          } else {
            $cfg = @{ cloudDbUrl = $env:SUPABASE_DB_URL } | ConvertTo-Json -Compress
            Set-Content -Path cloud-config.json -Value $cfg -Encoding utf8 -NoNewline
            Write-Output "OK cloud-config.json escrito ($($env:SUPABASE_DB_URL.Length) chars en URL)"
          }

      - name: Build resources (api + seed + web + agent)
        working-directory: apps/desktop
        # NEXT_PUBLIC_* se bakean en el bundle del web durante `next build`.
        # Las leemos de GitHub Actions secrets (configuradas a mano en Repo →
        # Settings → Secrets and variables → Actions) y las exponemos al step.
        # Si los secrets no existen, Realtime queda no-op silencioso (la app
        # sigue andando sin notificaciones cross-PC).
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm run build:resources

      # electron-builder con la layout de symlinks de pnpm cuelga silently en
      # windows-latest después de "collected node modules" (no llega a copiar
      # node_modules a win-unpacked, exit code 1, sin stderr ni con DEBUG
      # activo). Hipótesis: walking de symlinks pnpm + Windows ACLs hace que
      # algún paso interno se quede esperando indefinido y el step termina
      # forzado. Workaround: justo antes del build, reinstalamos las deps de
      # `apps/desktop` con npm (flat tree, sin .pnpm store) — esto no toca el
      # workspace ni rompe el resto del repo, solo da a electron-builder un
      # árbol plano que sí sabe procesar.
      - name: Reinstall desktop deps with npm (flat tree for electron-builder)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          npm install --no-package-lock --no-fund --no-audit

      - name: Build Windows installer + ZIP (no publish)
        working-directory: apps/desktop
        env:
          # Logs verbosos de electron-builder para que el próximo fail (si
          # ocurre) tenga contexto. No afecta perf.
          DEBUG: electron-builder
        # Llamamos al binario directo en vez de `pnpm exec` — npm install
        # acaba de regenerar `.bin/electron-builder.cmd` y queremos usar ese.
        run: ./node_modules/.bin/electron-builder.cmd --win --publish never

      # Listamos los assets generados para que el log de CI muestre los path
      # exactos antes del upload (debug helper).
      - name: List built artifacts
        working-directory: apps/desktop
        shell: pwsh
        run: |
          Write-Output "── Built artifacts ──"
          Get-ChildItem dist -File | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

      # Upload via gh CLI — más robusto que el publisher embebido de
      # electron-builder para archivos grandes (gh maneja retries y streaming
      # multipart de forma transparente). `--clobber` reemplaza assets si la
      # release ya existe (caso re-run del workflow sobre el mismo tag).
      - name: Upload assets to GitHub Release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:TAG
          Write-Output "Tag: $tag"

          # Crear la release si no existe (gh upload requiere release previa).
          # `--draft=false` para que salga directo a producción — electron-updater
          # consulta `latest.yml` y necesita la release publicada para que la
          # encargada reciba el update.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "Release no existe — creándola"
            gh release create $tag --title $tag --draft=false --notes "Auto-generated by CI. Edit notes manually after publish."
          }

          gh release upload $tag `
            "dist/SantaTeresita-Setup-$($tag.TrimStart('v')).exe" `
            "dist/SantaTeresita-Setup-$($tag.TrimStart('v')).exe.blockmap" `
            "dist/SantaTeresita-Setup-$($tag.TrimStart('v')).zip" `
            "dist/latest.yml" `
            --clobber
